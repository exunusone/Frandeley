<!doctype html>
<html lang="fr" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Frandeley — Une idée. Un morceau. La suite.</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      :root { color-scheme: dark; --canvas: #070b10; --white: #f8f9fb; --muted: #b2bfcb; --blue: #0962ff; }
      * { box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; background: var(--canvas); color: var(--white); font-family: Arial, Helvetica, sans-serif; }
      [data-composition-id="main"] { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--canvas); }
      .scene { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; background-color: var(--canvas); }
      .scene-photo { position: absolute; inset: 0; z-index: 0; width: 100%; height: 100%; object-fit: cover; opacity: .72; }
      .scene::after { content: ""; position: absolute; inset: 0; z-index: 1; background-color: rgba(7, 11, 16, .38); pointer-events: none; }
      .scene--hero .scene-photo { object-position: right center; opacity: .66; }
      .scene--capture .scene-photo { object-position: center center; opacity: .7; }
      .scene--collab .scene-photo { object-position: center center; opacity: .76; }
      .scene--prepare .scene-photo { object-position: center center; opacity: .72; }
      .scene--final .scene-photo { object-position: center 58%; opacity: .57; }
      .scene-content { position: relative; z-index: 2; display: flex; flex-direction: column; justify-content: center; width: 100%; height: 100%; padding: 112px 148px 88px; }
      .scene-head { display: flex; flex-direction: column; align-items: flex-start; max-width: 1490px; }
      .scene-label { display: flex; align-items: center; gap: 16px; color: #b2bfcb; font-size: 28px; line-height: 1.3; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
      .scene-label::before { content: ""; display: block; width: 34px; height: 2px; background-color: var(--blue); }
      .scene-title { max-width: 1450px; margin: 33px 0 0; color: var(--white); font-size: 112px; font-weight: 800; line-height: 1.02; letter-spacing: -.065em; }
      .scene-title span { display: block; }
      .scene-title .blue-period { display: inline; color: #3a82ff; }
      .scene-rule { width: 178px; height: 3px; margin-top: 31px; transform-origin: left center; background-color: var(--blue); }
      .scene-copy { max-width: 860px; margin: 27px 0 0; color: #d2dbe4; font-size: 30px; line-height: 1.45; }
      .scene-meta { display: flex; justify-content: space-between; align-items: center; gap: 26px; width: 100%; margin-top: auto; padding-top: 34px; border-top: 1px solid rgba(248, 249, 251, .25); color: #b2bfcb; font-size: 28px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
      .scene-meta strong { color: var(--white); }
      .scene-note { color: #b2bfcb; font-size: 28px; font-weight: 400; letter-spacing: .02em; text-transform: none; }
      .scene--hero .scene-title { max-width: 1260px; font-size: 132px; }
      .scene--final .scene-content { padding-top: 102px; }
      .final-brand { display: flex; align-items: center; gap: 22px; margin-bottom: 24px; }
      .final-brand img { width: 78px; height: 78px; object-fit: cover; filter: invert(1) hue-rotate(180deg) contrast(1.25); mix-blend-mode: screen; }
      .final-wordmark { display: flex; flex-direction: column; gap: 6px; font-size: 39px; font-weight: 800; letter-spacing: .22em; }
      .final-wordmark small { color: #c8d1da; font-size: 28px; letter-spacing: .19em; }
      .scene--final .scene-title { max-width: 1410px; margin-top: 19px; font-size: 96px; }
      .scene--final .scene-copy { max-width: 920px; margin-top: 24px; font-size: 28px; }
      .final-cta { display: inline-flex; align-items: center; gap: 15px; margin-top: 29px; padding: 14px 19px; border: 1px solid rgba(9, 98, 255, .8); color: var(--white); background-color: rgba(9, 98, 255, .18); font-size: 28px; font-weight: 700; }
      .final-cta span { color: #73a8ff; font-size: 28px; }
      .scene--final .scene-meta { margin-top: 30px; }
      .transition-curtain { position: absolute; inset: 0; z-index: 20; background-color: var(--blue); transform: scaleX(0); transform-origin: left center; }
    </style>
  </head>
  <body>
    <div id="film-root" data-composition-id="main" data-start="0" data-duration="20" data-width="1920" data-height="1080">
      <div id="clip-scene-01" class="clip" data-composition-id="scene-01" data-composition-src="compositions/scene-01.html" data-start="0" data-duration="4.1" data-track-index="0" data-width="1920" data-height="1080"></div>
      <div id="clip-scene-02" class="clip" data-composition-id="scene-02" data-composition-src="compositions/scene-02.html" data-start="4.1" data-duration="3.9" data-track-index="0" data-width="1920" data-height="1080"></div>
      <div id="clip-scene-03" class="clip" data-composition-id="scene-03" data-composition-src="compositions/scene-03.html" data-start="8" data-duration="3.9" data-track-index="0" data-width="1920" data-height="1080"></div>
      <div id="clip-scene-04" class="clip" data-composition-id="scene-04" data-composition-src="compositions/scene-04.html" data-start="11.9" data-duration="3.9" data-track-index="0" data-width="1920" data-height="1080"></div>
      <div id="clip-scene-05" class="clip" data-composition-id="scene-05" data-composition-src="compositions/scene-05.html" data-start="15.8" data-duration="4.2" data-track-index="0" data-width="1920" data-height="1080"></div>

      <div id="transition-curtain" class="clip transition-curtain" data-start="0" data-duration="20" data-track-index="1"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // The first key image is visible at frame zero.
      tl.from("#clip-scene-01", { scale: 1.015, duration: 0.56, ease: "power4.out" }, 0.08);

      // One cobalt curtain covers the outgoing scene before the next composition starts.
      tl.from("#clip-scene-02", { opacity: 0, x: 44, duration: 0.5, ease: "power3.out" }, 4.1);
      tl.from("#clip-scene-03", { opacity: 0, y: 32, duration: 0.55, ease: "power4.out" }, 8);
      tl.from("#clip-scene-04", { opacity: 0, scale: 1.02, duration: 0.52, ease: "expo.out" }, 11.9);
      tl.from("#clip-scene-05", { opacity: 0, x: -34, duration: 0.57, ease: "power4.out" }, 15.8);

      tl.set("#transition-curtain", { transformOrigin: "left center" }, 3.75);
      tl.to("#transition-curtain", { scaleX: 1, duration: 0.22, ease: "power4.in" }, 3.75);
      tl.set("#transition-curtain", { transformOrigin: "right center" }, 4.1);
      tl.to("#transition-curtain", { scaleX: 0, duration: 0.35, ease: "power4.out" }, 4.1);

      tl.set("#transition-curtain", { transformOrigin: "left center" }, 7.65);
      tl.to("#transition-curtain", { scaleX: 1, duration: 0.22, ease: "power4.in" }, 7.65);
      tl.set("#transition-curtain", { transformOrigin: "right center" }, 8.0);
      tl.to("#transition-curtain", { scaleX: 0, duration: 0.35, ease: "power4.out" }, 8.0);

      tl.set("#transition-curtain", { transformOrigin: "left center", backgroundColor: "#0d141c" }, 11.55);
      tl.to("#transition-curtain", { scaleX: 1, duration: 0.22, ease: "power4.in" }, 11.55);
      tl.set("#transition-curtain", { transformOrigin: "right center" }, 11.9);
      tl.to("#transition-curtain", { scaleX: 0, duration: 0.35, ease: "power4.out" }, 11.9);

      tl.set("#transition-curtain", { transformOrigin: "left center", backgroundColor: "#0962ff" }, 15.45);
      tl.to("#transition-curtain", { scaleX: 1, duration: 0.22, ease: "power4.in" }, 15.45);
      tl.set("#transition-curtain", { transformOrigin: "right center" }, 15.8);
      tl.to("#transition-curtain", { scaleX: 0, duration: 0.35, ease: "power4.out" }, 15.8);

      window.__timelines.main = tl;
    </script>
  </body>
</html>
